<!DOCTYPE html>
<html>
<head>
<title>All India Tourist Finder | Ashish Tools</title>
</head>

<body style="text-align:center; font-family:sans-serif">

<h1>🇮🇳 All India Tourist Finder</h1>

<input type="text" id="city" placeholder="Enter city (e.g. Jaipur, Delhi, Goa)">

<br><br>

<button onclick="findPlaces()">Find Tourist Places</button>

<div id="result" style="margin-top:20px;"></div>

<script>
function findPlaces(){

let city = document.getElementById("city").value.toLowerCase();

let places = {

"delhi": ["Red Fort","India Gate","Qutub Minar","Lotus Temple","Akshardham"],
"jaipur": ["Hawa Mahal","Amber Fort","City Palace","Jantar Mantar","Nahargarh Fort"],
"agra": ["Taj Mahal","Agra Fort","Mehtab Bagh","Fatehpur Sikri"],
"mumbai": ["Gateway of India","Marine Drive","Elephanta Caves","Juhu Beach"],
"goa": ["Baga Beach","Calangute Beach","Anjuna Beach","Fort Aguada"],
"udaipur": ["City Palace","Lake Pichola","Fateh Sagar Lake","Sajjangarh Palace"],
"jodhpur": ["Mehrangarh Fort","Umaid Bhawan Palace","Jaswant Thada"],
"varanasi": ["Kashi Vishwanath Temple","Dashashwamedh Ghat","Sarnath"],
"amritsar": ["Golden Temple","Jallianwala Bagh","Wagah Border"],
"shimla": ["Mall Road","Kufri","Jakhoo Temple"],
"manali": ["Solang Valley","Rohtang Pass","Hadimba Temple"],
"leh": ["Pangong Lake","Magnetic Hill","Shanti Stupa"],
"kerala": ["Munnar","Alleppey Backwaters","Kovalam Beach","Wayanad"],
"chennai": ["Marina Beach","Kapaleeshwarar Temple","Fort St George"],
"kolkata": ["Victoria Memorial","Howrah Bridge","Dakshineswar Temple"],
"hyderabad": ["Charminar","Golconda Fort","Ramoji Film City"],
"bangalore": ["Lalbagh","Cubbon Park","Bangalore Palace"],
"mysore": ["Mysore Palace","Chamundi Hills","Brindavan Gardens"],
"rishikesh": ["Laxman Jhula","Ram Jhula","Triveni Ghat"],
"haridwar": ["Har Ki Pauri","Mansa Devi Temple"],
"andaman": ["Radhanagar Beach","Cellular Jail"],
"darjeeling": ["Tiger Hill","Batasia Loop","Tea Gardens"],
"ooty": ["Ooty Lake","Botanical Garden","Doddabetta Peak"],
"pune": ["Shaniwar Wada","Sinhagad Fort"],
"bhopal": ["Upper Lake","Van Vihar National Park"]

};

let result = document.getElementById("result");

if(places[city]){

let html = "<h2>Famous Tourist Places:</h2><ul>";

places[city].forEach(p=>{
html += "<li>" + p + "</li>";
});

html += "</ul>";

result.innerHTML = html;

}else{

result.innerHTML = " All Cities";

}

}
</script>

</body>
</html>
