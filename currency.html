<!DOCTYPE html>
<html>
<head>
<title>Currency Converter All Countries | Ashish Tools</title>
</head>
<body style="text-align:center; font-family:sans-serif">

<h1>Currency Converter</h1>

<p>Enter Amount (INR):</p>
<input type="number" id="inr">

<br><br>

<button onclick="convert()">Convert</button>

<p id="result"></p>

<script>
function convert(){
let i = document.getElementById("inr").value;

if(i==""){
document.getElementById("result").innerHTML="Please enter amount";
return;
}

// Approx rates (demo purpose)
let usd = i / 83;
let eur = i / 90;
let gbp = i / 105;
let jpy = i * 1.8;
let aed = i / 22;

document.getElementById("result").innerHTML =
"USD: " + usd.toFixed(2) + "<br>" +
"EUR: " + eur.toFixed(2) + "<br>" +
"GBP: " + gbp.toFixed(2) + "<br>" +
"JPY: " + jpy.toFixed(2) + "<br>" +
"AED: " + aed.toFixed(2);
}
</script>

</body>
</html>
