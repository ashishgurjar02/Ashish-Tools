<h2>📸 Instagram Live Followers</h2>

<input id="user" placeholder="Enter Username">
<button onclick="getFollowers()">Get Followers</button>

<h2 id="result"></h2>

<script>

function getFollowers(){

let username = document.getElementById("user").value;

fetch("https://instagram-scraper-stable-api.p.rapidapi.com/get_ig_user_followers_v2.php?username="+username, {
	method: "GET",
	headers: {
		"X-RapidAPI-Key": "7424e8b3cbmshc99285958b2ac5fp1df7d1jsn28a655897217",
		"X-RapidAPI-Host": "instagram-scraper-stable-api.p.rapidapi.com"
	}
})
.then(res => res.json())
.then(data => {

console.log(data);

document.getElementById("result").innerText =
"Followers: " + data.followers;

})
.catch(err => {
document.getElementById("result").innerText =
"Error loading data";
});

}

</script>
