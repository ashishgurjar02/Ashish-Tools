<!DOCTYPE html>
<html>
<head>
<title>AI BG Remover + Color | Ashish Tools</title>
</head>

<body style="font-family:sans-serif; text-align:center">

<h1>🤖 AI Background Remover + Color</h1>

<input type="file" id="file">

<br><br>

<button onclick="removeBG()">Remove Background</button>

<br><br>

<p>Select Background Color:</p>
<input type="color" id="color" value="#ffffff">

<br><br>

<button onclick="applyColor()">Apply Color</button>

<br><br>

<canvas id="canvas" style="max-width:90%; border:1px solid black"></canvas>

<br><br>

<button onclick="download()">Download Image</button>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let img = new Image();

async function removeBG(){

let file = document.getElementById("file").files[0];

if(!file){
alert("Select image");
return;
}

let formData = new FormData();
formData.append("image_file", file);
formData.append("size", "auto");

let response = await fetch("https://api.remove.bg/v1.0/removebg", {
method: "POST",
headers: {
"X-Api-Key": "YOUR_API_KEY_HERE"
},
body: formData
});

if(!response.ok){
alert("API error / limit reached");
return;
}

let blob = await response.blob();
let url = URL.createObjectURL(blob);

img.onload = function(){
canvas.width = img.width;
canvas.height = img.height;
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0);
};

img.src = url;
}

function applyColor(){

let color = document.getElementById("color").value;

// create temp canvas
let tempCanvas = document.createElement("canvas");
let tempCtx = tempCanvas.getContext("2d");

tempCanvas.width = canvas.width;
tempCanvas.height = canvas.height;

// fill background color
tempCtx.fillStyle = color;
tempCtx.fillRect(0,0,tempCanvas.width,tempCanvas.height);

// draw image on top
tempCtx.drawImage(canvas,0,0);

// copy back to main canvas
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(tempCanvas,0,0);
}

function download(){
let link = document.createElement("a");
link.download = "bg-color.png";
link.href = canvas.toDataURL();
link.click();
}
</script>

</body>
</html>
