<!DOCTYPE html>
<html>
<head><style>
body{
user-select: none;
}
</style>
<title>Age Difference Calculator Free | Ashish Tools</title>
</head>
<body style="text-align:center">

<h1>Age Difference Calculator</h1>

<input type="number" id="a1" placeholder="Person 1 Age">
<br><br>

<input type="number" id="a2" placeholder="Person 2 Age">
<br><br>

<button onclick="calc()">Calculate</button>

<p id="res"></p>

<script>
function calc(){
let a = document.getElementById("a1").value;
let b = document.getElementById("a2").value;

let diff = Math.abs(a - b);

document.getElementById("res").innerHTML="Age Difference: "+diff+" years";
}
</script>
<script src="protect.js"></script>
</body><script>
document.addEventListener("contextmenu", function(e){
e.preventDefault();
});

document.onkeydown = function(e) {
if (e.keyCode == 123) return false;
if (e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
if (e.ctrlKey && e.keyCode == 85) return false;
};
</script>
</html>
