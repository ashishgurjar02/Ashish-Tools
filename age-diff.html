<!DOCTYPE html>
<html>
<head>
<title>Age Difference Calculator</title>
</head>
<body style="text-align:center">

<h1>Age Difference Calculator</h1>

<input type="number" id="a1" placeholder="Person 1 Age">
<br><br>

<input type="number" id="a2" placeholder="Person 2 Age">
<br><br>

<button onclick="calc()">Calculate</button>

<p id="res"></p>

<script>
function calc(){
let a = document.getElementById("a1").value;
let b = document.getElementById("a2").value;

let diff = Math.abs(a - b);

document.getElementById("res").innerHTML="Age Difference: "+diff+" years";
}
</script>

</body>
</html>
