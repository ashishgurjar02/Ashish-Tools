<!DOCTYPE html>
<html>
<head>
<title>All Countries Currency to INR | Ashish Tools</title>
</head>

<body style="text-align:center; font-family:sans-serif">

<h1>🌍 195 Countries Currency → INR</h1>

<input type="number" id="amount" placeholder="Enter amount">

<br><br>

<select id="currency"></select>

<br><br>

<button onclick="convert()">Convert to INR</button>

<h2 id="result"></h2>

<script>

// load all currencies automatically
async function loadCurrencies(){

let res = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
let data = await res.json();

let currencies = Object.keys(data.rates);

let dropdown = document.getElementById("currency");

currencies.forEach(cur=>{
let option = document.createElement("option");
option.value = cur;
option.text = cur;
dropdown.appendChild(option);
});

}

loadCurrencies();

// convert function
async function convert(){

let amount = document.getElementById("amount").value;
let currency = document.getElementById("currency").value;

if(amount==""){
document.getElementById("result").innerHTML="Enter amount";
return;
}

let res = await fetch("https://api.exchangerate-api.com/v4/latest/" + currency);
let data = await res.json();

let rate = data.rates["INR"];
let result = amount * rate;

document.getElementById("result").innerHTML =
amount + " " + currency + " = " + result.toFixed(2) + " INR";

}
</script>

</body>
</html>
