<!DOCTYPE html>
<html>
<head>
<title>Word Counter Tool | Ashish Tools</title>
</head>

<body style="font-family:sans-serif; text-align:center">

<h1>✍️ Word Counter Tool</h1>

<textarea id="text" rows="10" cols="40" placeholder="Type or paste text here..."></textarea>

<br><br>

<button onclick="count()">Count</button>

<h2 id="result"></h2>

<script>
function count(){
let text = document.getElementById("text").value;

let words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
let chars = text.length;

document.getElementById("result").innerHTML =
"Words: " + words + "<br>Characters: " + chars;
}
</script>

</body>
</html>
