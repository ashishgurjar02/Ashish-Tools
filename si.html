<!DOCTYPE html>
<html>
<head>
<title>Simple Interest Calculator | Ashish Tools</title>
</head>
<body style="text-align:center; font-family:sans-serif">

<h1>Simple Interest Calculator</h1>

<p>Principal Amount (P):</p>
<input type="number" id="p">

<p>Rate of Interest (%):</p>
<input type="number" id="r">

<p>Time (Years):</p>
<input type="number" id="t">

<br><br>

<button onclick="calcSI()">Calculate</button>

<p id="result"></p>

<script>
function calcSI(){
let p = document.getElementById("p").value;
let r = document.getElementById("r").value;
let t = document.getElementById("t").value;

if(p=="" || r=="" || t==""){
document.getElementById("result").innerHTML="Please enter all values";
return;
}

let si = (p * r * t) / 100;

document.getElementById("result").innerHTML =
"Simple Interest: " + si.toFixed(2);
}
</script>
<script src="protect.js"></script>
</body>
</html>
