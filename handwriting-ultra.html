<!DOCTYPE html>
<html>
<head>
<title>Handwriting Generator Ultra Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Indie+Flower&family=Dancing+Script&family=Satisfy&family=Great+Vibes&family=Caveat&family=Shadows+Into+Light&family=Amatic+SC&display=swap" rel="stylesheet">

<style>
body{
font-family:sans-serif;
text-align:center;
background:#f2f2f2;
}

textarea{
width:90%;
height:100px;
padding:10px;
margin:10px;
}

select, input, button{
padding:10px;
margin:5px;
}

#output{
margin-top:20px;
padding:30px;
min-height:150px;
background:white;
border:1px solid #ccc;
background-image: linear-gradient(#fff 95%, #ddd 95%);
background-size: 100% 30px;
}
</style>

</head>

<body>

<h1>✍️ Handwriting Generator Ultra</h1>

<textarea id="text" placeholder="Type your text here..."></textarea>

<br>

<select id="font">
<option value="'Pacifico'">Pacifico</option>
<option value="'Indie Flower'">Indie Flower</option>
<option value="'Dancing Script'">Dancing Script</option>
<option value="'Satisfy'">Satisfy</option>
<option value="'Great Vibes'">Great Vibes</option>
<option value="'Caveat'">Caveat</option>
<option value="'Shadows Into Light'">Notebook Style</option>
<option value="'Amatic SC'">Thin Style</option>
<option value="'Comic Sans MS'">Classic</option>
<option value="'Segoe Script'">Smooth</option>
</select>

<br>

<input type="color" id="color" value="#000000">
<label>Text Color</label>

<br>

<input type="range" id="size" min="16" max="60" value="24">
<label>Font Size</label>

<br>

<select id="bg">
<option value="white">Plain</option>
<option value="lined">Notebook</option>
<option value="yellow">Yellow Paper</option>
</select>

<br>

<button onclick="generate()">Generate</button>
<button onclick="download()">Download Image</button>

<div id="output"></div>

<script>
function generate(){

let text = document.getElementById("text").value;
let font = document.getElementById("font").value;
let color = document.getElementById("color").value;
let size = document.getElementById("size").value;
let bg = document.getElementById("bg").value;

let output = document.getElementById("output");

output.innerText = text;
output.style.fontFamily = font;
output.style.color = color;
output.style.fontSize = size + "px";

// background styles
if(bg=="lined"){
output.style.background = "repeating-linear-gradient(white, white 28px, #ddd 30px)";
}
else if(bg=="yellow"){
output.style.background = "#fff9c4";
}
else{
output.style.background = "white";
}

}

// download image
function download(){

html2canvas(document.getElementById("output")).then(canvas=>{
let link = document.createElement("a");
link.download = "handwriting.png";
link.href = canvas.toDataURL();
link.click();
});

}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
