<!DOCTYPE html>
<html>
<head>
<title>Image Compressor Pro | Ashish Tools</title>
</head>

<body style="font-family:sans-serif; text-align:center">

<h1>📸 Image Compressor Pro</h1>

<p>Select Image:</p>
<input type="file" id="file" accept="image/*">

<br><br>

<p>Resize Width (px):</p>
<input type="number" id="width" placeholder="e.g. 800">

<br><br>

<p>Quality (0.1 to 1):</p>
<input type="number" id="quality" step="0.1" min="0.1" max="1" value="0.7">

<br><br>

<button onclick="compress()">Compress Image</button>

<br><br>

<canvas id="canvas" style="max-width:90%; border:1px solid black"></canvas>

<br><br>

<button onclick="download()">Download Image</button>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

function compress(){

let file = document.getElementById("file").files[0];
let widthInput = document.getElementById("width").value;
let quality = document.getElementById("quality").value;

if(!file){
alert("Select image");
return;
}

let reader = new FileReader();

reader.onload = function(e){

let img = new Image();

img.onload = function(){

let newWidth = widthInput ? widthInput : img.width;
let ratio = img.height / img.width;
let newHeight = newWidth * ratio;

canvas.width = newWidth;
canvas.height = newHeight;

ctx.drawImage(img, 0, 0, newWidth, newHeight);

};

img.src = e.target.result;

};

reader.readAsDataURL(file);
}

function download(){

let quality = document.getElementById("quality").value;

let link = document.createElement("a");
link.download = "compressed.jpg";
link.href = canvas.toDataURL("image/jpeg", quality);
link.click();

}
</script>
<script src="protect.js"></script>
</body>
</html>
