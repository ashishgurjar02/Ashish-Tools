<h2>🎬 YouTube Title Generator</h2>

<input id="topic" placeholder="Enter topic">

<button onclick="generate()">Generate</button>

<p id="title"></p>
<p id="desc"></p>
<p id="tags"></p>

<script>
function generate(){

let t = document.getElementById("topic").value;

document.getElementById("title").innerText =
"🔥 Title: " + t + " Viral Trick";

document.getElementById("desc").innerText =
"📄 Description: Is video me " + t + " ki full jankari hai";

document.getElementById("tags").innerText =
"🏷️ Tags: " + t + ", viral, trending, youtube";

}
</script>
