<!DOCTYPE html>
<html>
<head>
<title>Font Style Generator</title>
</head>

<body style="text-align:center; font-family:sans-serif">

<h1>🔠 Font Style Generator</h1>

<input type="text" id="text" placeholder="Enter text">

<br><br>

<button onclick="generate()">Generate Styles</button>

<div id="output"></div>

<script>
function generate(){

let text = document.getElementById("text").value;

let styles = [
text.toUpperCase(),
text.toLowerCase(),
text.bold(),
text.italics(),
"★ " + text + " ★",
"🔥 " + text + " 🔥",
"👉 " + text + " 👈"
];

let output = document.getElementById("output");
output.innerHTML = "";

styles.forEach(s=>{
let p = document.createElement("p");
p.innerHTML = s;
output.appendChild(p);
});

}
</script>

</body>
</html>
