<!DOCTYPE html>
<html>
<head>
<title>All Emoji Generator | Ashish Tools</title>

<style>
body{
font-family:sans-serif;
text-align:center;
background:#f2f2f2;
}

h1{
background:#333;
color:white;
padding:10px;
}

button{
margin:5px;
padding:10px;
}

#emojiBox{
margin-top:20px;
padding:15px;
background:white;
min-height:150px;
font-size:25px;
}

</style>

</head>

<body>

<h1>😀 All Emoji Generator</h1>

<!-- CATEGORY BUTTONS -->
<button onclick="show('smile')">😀 Smileys</button>
<button onclick="show('love')">❤️ Love</button>
<button onclick="show('animals')">🐶 Animals</button>
<button onclick="show('food')">🍔 Food</button>
<button onclick="show('sports')">⚽ Sports</button>
<button onclick="show('travel')">✈️ Travel</button>
<button onclick="show('symbols')">🔣 Symbols</button>
<button onclick="show('flags')">🌍 Flags</button>

<div id="emojiBox">Click a category</div>

<script>

// EMOJI DATA
let data = {

smile: "😀 😁 😂 🤣 😃 😄 😅 😆 😉 😊 😋 😎 😍 😘 😗 😙 😚 ☺️ 🙂 🤗 🤩 🤔 🤨 😐 😑 😶 🙄 😏 😣 😥 😮 🤐 😯 😪 😫 😴",

love: "❤️ 💕 💖 💗 💓 💞 💘 💝 💟 ❣️ 💔 ❤️‍🔥 ❤️‍🩹 💑 👩‍❤️‍👨 👨‍❤️‍👨 👩‍❤️‍👩",

animals: "🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🐤 🐺 🐗 🐴 🦄",

food: "🍔 🍟 🍕 🌭 🍿 🥓 🍗 🍖 🍤 🍣 🍱 🍜 🍩 🍪 🎂 🍰 🍫 🍬 🍭 🍺 🍷 ☕",

sports: "⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🏸 🥅 🏒 🏑 🏏 🥊 🥋 🎽 🛹",

travel: "✈️ 🚗 🚕 🚙 🚌 🚎 🏎️ 🚓 🚑 🚒 🚐 🛵 🚲 🚂 🚆 🚊 🚢 🚤 🛳️",

symbols: "❤️ ✔️ ❌ ⭐ 🔥 💯 ⚠️ ❗ ❓ 🔔 🎵 🔒 🔑 💡 📌 📍",

flags: "🇮🇳 🇺🇸 🇬🇧 🇨🇦 🇦🇺 🇯🇵 🇨🇳 🇫🇷 🇩🇪 🇮🇹 🇧🇷 🇷🇺 🇿🇦 🇲🇽 🇰🇷"

};

// SHOW FUNCTION
function show(type){
document.getElementById("emojiBox").innerText = data[type];
}

// COPY ON CLICK
document.addEventListener("click", function(e){
if(e.target.innerText.length < 5){
navigator.clipboard.writeText(e.target.innerText);
alert("Copied: " + e.target.innerText);
}
});

</script>

</body>
</html>
