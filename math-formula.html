<!DOCTYPE html>
<html>
<head>
<title>Full Math Formula Finder</title>
</head>

<body>

<h1>📘 Math Full Formula Finder (1–12)</h1>

<select id="class">
<option value="1">Class 1</option>
<option value="2">Class 2</option>
<option value="3">Class 3</option>
<option value="4">Class 4</option>
<option value="5">Class 5</option>
<option value="6">Class 6</option>
<option value="7">Class 7</option>
<option value="8">Class 8</option>
<option value="9">Class 9</option>
<option value="10">Class 10</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>

<button onclick="getFormula()">Get All Formulas</button>

<div id="box"></div>

<script>

let apiURL = "math-full-api.json";

function getFormula(){

let c = document.getElementById("class").value;

fetch(apiURL)
.then(res => res.json())
.then(data => {

let result = data[c];

if(result){

document.getElementById("box").innerHTML =
"📘 Class " + c + " Full Formulas:<br><br>" +
result.map(x => "✔ " + x).join("<br>");

}else{
document.getElementById("box").innerHTML = "No data found";
}

});

}

</script>

</body>
</html>
