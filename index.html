<!DOCTYPE html>
<html>
<head>
<title>Video Downloader Pro</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:20px;
}

.box{
background:#1e293b;
padding:30px;
border-radius:15px;
max-width:400px;
margin:auto;
}

input{
width:90%;
padding:12px;
margin:15px;
border-radius:10px;
border:none;
}

button{
padding:12px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
}

.red{background:#ef4444;color:white;}
.blue{background:#3b82f6;color:white;}
.green{background:#22c55e;color:white;}
</style>

</head>

<body>

<h2>🔥 Video Downloader Pro</h2>

<div class="box">

<input id="link" placeholder="Paste Video Link">

<br>

<button class="red" onclick="download()">Download Video</button>
<button class="blue" onclick="mp3()">Download MP3</button>
<button class="green" onclick="preview()">Preview</button>

</div>

<script>

function download(){
let url = document.getElementById("link").value;
window.open("https://en.savefrom.net/1-youtube-video-downloader/?url="+url);
}

function mp3(){
let url = document.getElementById("link").value;
window.open("https://en.savefrom.net/1-youtube-video-downloader/?url="+url);
}

function preview(){
let url = document.getElementById("link").value;
window.open(url);
}

</script>

</body>
</html>
