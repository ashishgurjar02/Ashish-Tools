<!DOCTYPE html>
<html>
<head>
<title>Loan Calculator</title>
</head>
<body style="text-align:center">

<h1>Loan Calculator</h1>

<input type="number" id="amount" placeholder="Loan Amount">
<br><br>

<input type="number" id="interest" placeholder="Interest %">
<br><br>

<input type="number" id="years" placeholder="Years">
<br><br>

<button onclick="calc()">Calculate</button>

<p id="res"></p>

<script>
function calc(){
let p=document.getElementById("amount").value;
let r=document.getElementById("interest").value;
let t=document.getElementById("years").value;

let si = (p*r*t)/100;

document.getElementById("res").innerHTML="Total Interest: "+si;
}
</script>

</body>
</html>
