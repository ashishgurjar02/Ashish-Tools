<!DOCTYPE html>
<html>
<head><style>
body{
user-select: none;
}
</style>
<title>Advanced PDF Tool | Ashish Tools</title>
</head>

<body style="font-family:sans-serif; text-align:center">

<h1>📄 Advanced Image to PDF Tool</h1>

<p>Select Multiple Images</p>

<input type="file" id="files" multiple accept="image/*">

<br><br>

<button onclick="createPDF()">Create PDF</button>

<p id="msg"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
async function createPDF(){
const { jsPDF } = window.jspdf;

let files = document.getElementById("files").files;

if(files.length === 0){
document.getElementById("msg").innerHTML = "Please select images";
return;
}

let pdf = new jsPDF("p", "mm", "a4");

for(let i=0;i<files.length;i++){

let file = files[i];

let imgData = await new Promise(resolve=>{
let reader = new FileReader();
reader.onload = e => resolve(e.target.result);
reader.readAsDataURL(file);
});

// add new page after first
if(i > 0){
pdf.addPage();
}

// A4 size fit
pdf.addImage(imgData, "JPEG", 10, 10, 190, 270);
}

pdf.save("ashish-tools.pdf");

document.getElementById("msg").innerHTML = "PDF Created Successfully ✔️";
}
</script>

</body><script>
document.addEventListener("contextmenu", function(e){
e.preventDefault();
});

document.onkeydown = function(e) {
if (e.keyCode == 123) return false;
if (e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
if (e.ctrlKey && e.keyCode == 85) return false;
};
</script>
</html>
