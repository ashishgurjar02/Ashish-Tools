<!DOCTYPE html>
<html>
<head>
<title>Instagram Downloader Pro</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
text-align:center;
padding:20px;
}

.box{
background:#1e293b;
padding:25px;
border-radius:15px;
max-width:380px;
margin:auto;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input{
width:90%;
padding:12px;
margin:12px;
border-radius:10px;
border:none;
font-size:15px;
}

button{
padding:12px;
margin:6px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.btn{
background:#e1306c;
color:white;
}

iframe{
width:100%;
height:420px;
border:none;
margin-top:20px;
border-radius:12px;
}
</style>

</head>

<body>

<h2>📸 Instagram Video Downloader</h2>

<div class="box">

<input id="link" placeholder="Paste Instagram Reel / Video Link">

<br>

<button class="btn" onclick="download()">Download Now</button>

</div>

<div id="result"></div>

<script>

function download(){

let url = document.getElementById("link").value;

if(!url){
alert("Link daalo");
return;
}

// 🔥 iframe ke andar hi open
document.getElementById("result").innerHTML =
'<iframe src="https://snapinsta.app/?url='+url+'"></iframe>';

}

</script>

</body>
</html>
