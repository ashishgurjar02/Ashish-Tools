<!DOCTYPE html>
<html>
<head>
<title>Ultra Photo Enhance Tool | Ashish Tools</title>
</head>

<body style="font-family:sans-serif; text-align:center">

<h1>📸 Ultra Photo Enhancer (100K Style)</h1>

<p>Select Image:</p>

<input type="file" id="file" accept="image/*">

<br><br>

<button onclick="enhance()">Enhance Image</button>

<br><br>

<canvas id="canvas" style="max-width:95%; border:2px solid black"></canvas>

<br><br>

<button onclick="download()">Download Enhanced Image</button>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let img = new Image();

function enhance(){

let file = document.getElementById("file").files[0];

if(!file){
alert("Please select image");
return;
}

let reader = new FileReader();

reader.onload = function(e){

img.onload = function(){

// 🔥 Ultra upscale (fake high quality)
canvas.width = img.width * 3;
canvas.height = img.height * 3;

// smooth
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

// draw base image
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

// apply enhancement filter
ctx.filter = "contrast(1.4) saturate(1.3) brightness(1.15) sharpness(1.2)";
ctx.drawImage(canvas, 0, 0);

};

img.src = e.target.result;

};

reader.readAsDataURL(file);
}

function download(){
let a = document.createElement("a");
a.download = "ultra-enhanced.png";
a.href = canvas.toDataURL("image/png");
a.click();
}
</script>

</body>
</html>
