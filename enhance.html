<!DOCTYPE html>
<html>
<head>
<title>8K Photo Enhance Tool | Ashish Tools</title>
</head>

<body style="font-family:sans-serif; text-align:center">

<h1>📸 8K Photo Quality Enhancer</h1>

<p>Select Image:</p>

<input type="file" id="file" accept="image/*">

<br><br>

<button onclick="enhance()">Enhance Image</button>

<br><br>

<canvas id="canvas" style="max-width:90%; border:1px solid black"></canvas>

<br><br>

<button onclick="download()">Download Image</button>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let img = new Image();

function enhance(){

let file = document.getElementById("file").files[0];

if(!file){
alert("Please select image");
return;
}

let reader = new FileReader();

reader.onload = function(e){
img.onload = function(){

// upscale canvas (fake 8K effect)
canvas.width = img.width * 2;
canvas.height = img.height * 2;

// smooth rendering
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

// draw image larger
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

// extra sharp filter effect
ctx.filter = "contrast(1.2) saturate(1.2) brightness(1.1)";
ctx.drawImage(canvas, 0, 0);

};
img.src = e.target.result;
};

reader.readAsDataURL(file);
}

function download(){
let link = document.createElement("a");
link.download = "enhanced-image.png";
link.href = canvas.toDataURL();
link.click();
}
</script>

</body>
</html>
