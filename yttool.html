<!DOCTYPE html>
<html>
<head>
<title>YouTube Tool</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
padding:20px;
}

.box{
background:#222;
padding:20px;
border-radius:10px;
max-width:350px;
margin:auto;
}

input{
width:90%;
padding:10px;
margin:10px;
border-radius:8px;
border:none;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:red;
color:white;
cursor:pointer;
margin:5px;
}
</style>

</head>

<body>

<h2>🎥 YouTube Toolkit</h2>

<div class="box">

<input id="link" placeholder="Paste YouTube Link">

<br>

<button onclick="openVideo()">Open Video</button>

<button onclick="getThumb()">Thumbnail</button>

</div>

<script>

function getID(url){

let id = "";

try{
let u = new URL(url);

if(u.hostname.includes("youtu.be")){
id = u.pathname.slice(1);
}
else if(u.pathname.includes("/shorts/")){
id = u.pathname.split("/shorts/")[1].split("?")[0];
}
else{
id = u.searchParams.get("v");
}
}catch(e){
alert("Invalid Link");
}

return id;
}

function openVideo(){

let url = document.getElementById("link").value;
let id = getID(url);

window.open("https://www.youtube.com/watch?v="+id, "_blank");

}

function getThumb(){

let url = document.getElementById("link").value;
let id = getID(url);

window.open("https://img.youtube.com/vi/"+id+"/hqdefault.jpg","_blank");

}

</script>

</body>
</html>
