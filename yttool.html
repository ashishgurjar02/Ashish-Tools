<!DOCTYPE html>
<html>
<head>
<title>YouTube Info Tool</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
padding:20px;
}
.box{
background:#222;
padding:20px;
border-radius:10px;
max-width:350px;
margin:auto;
}
input{
width:90%;
padding:10px;
margin:10px;
border-radius:8px;
border:none;
}
button{
padding:10px;
border:none;
border-radius:8px;
background:red;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<h2>🎥 YouTube Info Tool</h2>

<div class="box">

<input id="link" placeholder="Paste YouTube Link">

<br>

<button onclick="openVideo()">Get Info</button>

<p>👉 Video open hoga, waha se Title, Description, Tags copy karo</p>

</div>

<script>

function openVideo(){

let url = document.getElementById("link").value;

let id = "";

try{
let u = new URL(url);

if(u.hostname.includes("youtu.be")){
id = u.pathname.slice(1);
}
else if(u.pathname.includes("/shorts/")){
id = u.pathname.split("/shorts/")[1].split("?")[0];
}
else{
id = u.searchParams.get("v");
}
}catch(e){
alert("Invalid Link");
return;
}

// 🔥 direct open
window.open("https://www.youtube.com/watch?v="+id, "_blank");

}

</script>

</body>
</html>
