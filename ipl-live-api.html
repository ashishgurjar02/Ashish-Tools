<!DOCTYPE html>
<html>
<head>
<title>IPL Live Score | Ashish Tools</title>

<style>
body{
font-family:sans-serif;
text-align:center;
background:#f2f2f2;
}

h1{
background:#333;
color:white;
padding:10px;
}

.box{
background:white;
margin:10px;
padding:15px;
border:1px solid #ccc;
}
</style>

</head>

<body>

<h1>🏏 IPL Live Score (API)</h1>

<div id="matches">Loading matches...</div>

<script>

fetch("https://cricbuzz-cricket.p.rapidapi.com/matches/v1/live", {
method: "GET",
headers: {
"x-rapidapi-key": "7424e8b3cbmshc99285958b2ac5fp1df7d1jsn28a655897217",
"x-rapidapi-host": "cricbuzz-cricket.p.rapidapi.com"
}
})
.then(response => response.json())
.then(data => {

let html = "";

data.typeMatches.forEach(type=>{
type.seriesMatches.forEach(series=>{
series.seriesAdWrapper.matches.forEach(match=>{

let info = match.matchInfo;
let score = match.matchScore;

html += `
<div class="box">
<h3>${info.team1.teamName} vs ${info.team2.teamName}</h3>
<p>Status: ${info.status}</p>
<p>Score: ${score?.team1Score?.inngs1?.runs || 0}/${score?.team1Score?.inngs1?.wickets || 0}</p>
</div>
`;

});
});
});

document.getElementById("matches").innerHTML = html;

})
.catch(error=>{
document.getElementById("matches").innerText = "Error loading data ❌";
});

</script>

</body>
</html>
