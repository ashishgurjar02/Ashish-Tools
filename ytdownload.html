<!DOCTYPE html>
<html>
<head>
<title>YouTube Downloader</title>

<style>
body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
padding:20px;
}
.box{
background:#222;
padding:20px;
border-radius:10px;
max-width:350px;
margin:auto;
}
input{
width:90%;
padding:10px;
margin:10px;
border-radius:8px;
border:none;
}
button{
padding:10px;
border:none;
border-radius:8px;
background:red;
color:white;
cursor:pointer;
margin:5px;
}
</style>

</head>

<body>

<h2>🎥 YouTube Downloader</h2>

<div class="box">

<input id="link" placeholder="Paste link">
<button onclick="go()">Download</button>

<script>
function go(){
let url=document.getElementById("link").value;
window.open("https://www.ssyoutube.com/watch?v="+url.split("v=")[1]);
}
</script>

</body>
</html>
