<h2>🎥 YouTube Thumbnail Downloader</h2>

<input id="link" placeholder="Paste YouTube Link">

<button onclick="getThumb()">Get Thumbnail</button>

<br><br>

<img id="img" width="300">

<br><br>

<a id="download" download>
<button>Download Thumbnail</button>
</a>

<script>

function getThumb(){

let url = document.getElementById("link").value;

// 🔥 BEST VIDEO ID EXTRACT
let id = "";

try{
let u = new URL(url);

if(u.hostname.includes("youtu.be")){
id = u.pathname.slice(1);
}else{
id = u.searchParams.get("v");
}
}catch(e){
alert("Invalid Link");
return;
}

// 🔥 fallback system
let thumb1 = "https://img.youtube.com/vi/"+id+"/maxresdefault.jpg";
let thumb2 = "https://img.youtube.com/vi/"+id+"/hqdefault.jpg";

// image set
let img = document.getElementById("img");

img.src = thumb1;

// अगर HD नहीं मिला तो fallback
img.onerror = function(){
img.src = thumb2;
}

// download
document.getElementById("download").href = img.src;

}

</script>
