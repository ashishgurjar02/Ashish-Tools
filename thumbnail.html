<!DOCTYPE html>
<html>
<head>
<title>Thumbnail Downloader</title>

<style>
body{
font-family: Arial;
background: linear-gradient(135deg,#667eea,#764ba2);
color:white;
text-align:center;
padding:30px;
}

.box{
background:white;
color:black;
padding:20px;
border-radius:15px;
max-width:350px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

input{
width:90%;
padding:10px;
border-radius:10px;
border:none;
margin:10px;
}

button{
padding:10px 12px;
border:none;
border-radius:10px;
background:#667eea;
color:white;
cursor:pointer;
margin:5px;
}

img{
width:100%;
border-radius:10px;
margin-top:15px;
}

</style>
</head>

<body>

<h2>🎥 YouTube Thumbnail Downloader</h2>

<div class="box">

<input id="link" placeholder="Paste YouTube Link">

<br>

<button onclick="getThumb()">Get Thumbnail</button>

<br>

<img id="img">

<br>

<!-- 🔥 QUALITY BUTTONS -->
<div id="btns" style="display:none;">
<button onclick="download('maxres')">HD</button>
<button onclick="download('hq')">Medium</button>
<button onclick="download('mq')">Low</button>
</div>

</div>

<script>

let videoId = "";

function getThumb(){

let url = document.getElementById("link").value;

try{
let u = new URL(url);

if(u.hostname.includes("youtu.be")){
videoId = u.pathname.slice(1);
}else{
videoId = u.searchParams.get("v");
}
}catch(e){
alert("Invalid Link");
return;
}

// show image
let thumb = "https://img.youtube.com/vi/"+videoId+"/hqdefault.jpg";
document.getElementById("img").src = thumb;

// 🔥 buttons show करो
document.getElementById("btns").style.display = "block";

}

function download(type){

let quality = "";

if(type=="maxres"){
quality = "maxresdefault.jpg";
}
else if(type=="hq"){
quality = "hqdefault.jpg";
}
else{
quality = "mqdefault.jpg";
}

let link = "https://img.youtube.com/vi/"+videoId+"/"+quality;

fetch(link)
.then(res => res.blob())
.then(blob => {

let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "thumbnail.jpg";
a.click();

});

}

</script>

</body>
</html>
