<!DOCTYPE html>
<html>
<head>
<title>YouTube Extractor</title>
</head>

<body style="text-align:center;font-family:Arial;background:#111;color:white;">

<h2>🎥 YouTube Tool</h2>

<input id="link" placeholder="Paste YouTube Link" style="padding:10px;width:80%;">

<br><br>

<button onclick="getTitle()">Get Title</button>
<button onclick="openDesc()">Get Description</button>
<button onclick="openTags()">Get Tags</button>

<h3 id="title"></h3>

<script>

function getID(url){

let id="";

try{
let u=new URL(url);

if(u.hostname.includes("youtu.be")){
id=u.pathname.slice(1);
}
else if(u.pathname.includes("/shorts/")){
id=u.pathname.split("/shorts/")[1].split("?")[0];
}
else{
id=u.searchParams.get("v");
}
}catch(e){
alert("Invalid link");
}

return id;
}

// 🔥 Description
function openDesc(){

let url=document.getElementById("link").value;
let id=getID(url);

window.open("https://www.youtube.com/watch?v="+id,"_blank");

alert("👉 Video open hogi\n👉 'Show more' dabao\n👉 Description copy karo");

}

// 🔥 Tags
function openTags(){

let url=document.getElementById("link").value;
let id=getID(url);

window.open("https://www.youtube.com/watch?v="+id,"_blank");

alert("👉 Desktop mode ON karo\n👉 Page source kholo\n👉 'keywords' search karo\n👉 wahi tags hain");

}

</script>

</body>
</html>
