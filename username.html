<h2>🔥 Instagram Username Checker</h2>

<input id="user" placeholder="Enter username">

<button onclick="check()">Check</button>

<h3 id="result"></h3>

<script>

function check(){

let u = document.getElementById("user").value;

// new tab में instagram open
let url = "https://www.instagram.com/" + u;

window.open(url, "_blank");

// message
document.getElementById("result").innerText =
"👉 अगर profile open हो जाए = ❌ Taken\n👉 अगर page not found आए = ✅ Available";

}

</script>
