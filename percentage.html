<!DOCTYPE html>
<html>
<head><style>
body{
user-select: none;
}
</style>
<title>Percentage Calculator Online | Ashish Tools</title>
</head>
<body style="text-align:center; font-family:sans-serif">

<h1>Percentage Calculator</h1>

<p>Enter Marks Obtained:</p>
<input type="number" id="marks">

<p>Enter Total Marks:</p>
<input type="number" id="total">

<br><br>

<button onclick="calc()">Calculate</button>

<p id="result"></p>

<script>
function calc(){
let m = document.getElementById("marks").value;
let t = document.getElementById("total").value;

if(m=="" || t==""){
document.getElementById("result").innerHTML="Please enter values";
return;
}

let percent = (m / t) * 100;

document.getElementById("result").innerHTML = "Percentage: " + percent.toFixed(2) + "%";
}
</script>
<script src="protect.js"></script>
</body><script>
document.addEventListener("contextmenu", function(e){
e.preventDefault();
});

document.onkeydown = function(e) {
if (e.keyCode == 123) return false;
if (e.ctrlKey && e.shiftKey && e.keyCode == 73) return false;
if (e.ctrlKey && e.keyCode == 85) return false;
};
</script>
</html>
