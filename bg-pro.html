<!DOCTYPE html>
<html>
<head>
<title>Pro Background Remover | Ashish Tools</title>
</head>

<body style="font-family:sans-serif; text-align:center">

<h1>🎨 Pro Background Remover</h1>

<input type="file" id="file" accept="image/*">

<br><br>

<p>Background Color:</p>
<input type="color" id="color" value="#ffffff">

<br><br>

<button onclick="process()">Remove Background</button>

<br><br>

<canvas id="canvas" style="max-width:95%; border:2px solid black"></canvas>

<br><br>

<button onclick="download()">Download HD</button>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

function process(){

let file = document.getElementById("file").files[0];

if(!file){
alert("Select image");
return;
}

let reader = new FileReader();

reader.onload = function(e){

let img = new Image();

img.onload = function(){

canvas.width = img.width;
canvas.height = img.height;

ctx.drawImage(img, 0, 0);

let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
let data = imageData.data;

// advanced bg remove (light + green detection)
for(let i=0; i<data.length; i+=4){

let r = data[i];
let g = data[i+1];
let b = data[i+2];

// remove white / light bg
if(r>200 && g>200 && b>200){
data[i+3] = 0;
}

// remove green screen
if(g>150 && r<120 && b<120){
data[i+3] = 0;
}

}

ctx.putImageData(imageData, 0, 0);

// apply background color
let bgColor = document.getElementById("color").value;

ctx.globalCompositeOperation = "destination-over";
ctx.fillStyle = bgColor;
ctx.fillRect(0, 0, canvas.width, canvas.height);

// reset mode
ctx.globalCompositeOperation = "source-over";

};

img.src = e.target.result;

};

reader.readAsDataURL(file);
}

function download(){
let link = document.createElement("a");
link.download = "pro-bg.png";
link.href = canvas.toDataURL("image/png");
link.click();
}
</script>

</body>
</html>
