<!DOCTYPE html>
<html>
<head>
<title>Trigonometry Calculator | Ashish Tools</title>
</head>
<body style="text-align:center; font-family:sans-serif">

<h1>Trigonometry Calculator</h1>

<p>Enter Angle (in degrees):</p>
<input type="number" id="angle">

<br><br>

<button onclick="calc()">Calculate</button>

<p id="result"></p>

<script>
function calc(){
let a = document.getElementById("angle").value;

if(a==""){
document.getElementById("result").innerHTML="Please enter angle";
return;
}

// convert to radians
let rad = a * Math.PI / 180;

// calculations
let sin = Math.sin(rad);
let cos = Math.cos(rad);
let tan = Math.tan(rad);

let sec = 1 / cos;
let cosec = 1 / sin;

document.getElementById("result").innerHTML =
"sin: " + sin.toFixed(4) + "<br>" +
"cos: " + cos.toFixed(4) + "<br>" +
"tan: " + tan.toFixed(4) + "<br>" +
"sec: " + sec.toFixed(4) + "<br>" +
"cosec: " + cosec.toFixed(4);
}
</script>

</body>
</html>
